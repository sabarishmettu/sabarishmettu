<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 320" width="650" height="320">
  <defs>
    <style>
      @keyframes typeLine1 { 0%, 3% { width: 0; } 10%, 100% { width: 360px; } }
      @keyframes typeLine2 { 0%, 12% { width: 0; } 20%, 100% { width: 290px; } }
      @keyframes typeLine3 { 0%, 22% { width: 0; } 30%, 100% { width: 310px; } }
      @keyframes typeLine4 { 0%, 32% { width: 0; } 37%, 100% { width: 130px; } }
      @keyframes typeLine5 { 0%, 39% { width: 0; } 50%, 100% { width: 430px; } }
      @keyframes typeLine6 { 0%, 52% { width: 0; } 62%, 100% { width: 350px; } }
      @keyframes typeLine7 { 0%, 64% { width: 0; } 72%, 100% { width: 210px; } }
      @keyframes typeLine8 { 0%, 74% { width: 0; } 82%, 100% { width: 240px; } }
      @keyframes typeLine9 { 0%, 84% { width: 0; } 96%, 100% { width: 450px; } }

      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

      @keyframes fadeIn1 { 0%, 3% { opacity: 0; } 4% { opacity: 1; } }
      @keyframes fadeIn2 { 0%, 12% { opacity: 0; } 13% { opacity: 1; } }
      @keyframes fadeIn3 { 0%, 22% { opacity: 0; } 23% { opacity: 1; } }
      @keyframes fadeIn4 { 0%, 32% { opacity: 0; } 33% { opacity: 1; } }
      @keyframes fadeIn5 { 0%, 39% { opacity: 0; } 40% { opacity: 1; } }
      @keyframes fadeIn6 { 0%, 52% { opacity: 0; } 53% { opacity: 1; } }
      @keyframes fadeIn7 { 0%, 64% { opacity: 0; } 65% { opacity: 1; } }
      @keyframes fadeIn8 { 0%, 74% { opacity: 0; } 75% { opacity: 1; } }
      @keyframes fadeIn9 { 0%, 84% { opacity: 0; } 85% { opacity: 1; } }

      @keyframes cursorMove {
        0%, 3%   { transform: translate(0px, 0px); }
        10%, 12% { transform: translate(360px, 0px); }
        20%, 22% { transform: translate(290px, 26px); }
        30%, 32% { transform: translate(310px, 52px); }
        37%, 39% { transform: translate(130px, 78px); }
        50%, 52% { transform: translate(430px, 104px); }
        62%, 64% { transform: translate(350px, 130px); }
        72%, 74% { transform: translate(210px, 156px); }
        82%, 84% { transform: translate(240px, 182px); }
        96%, 100% { transform: translate(450px, 208px); }
      }

      .terminal-bg { fill: #0d1117; }
      .terminal-header { fill: #161b22; }
      .terminal-dot-red { fill: #ff5f57; }
      .terminal-dot-yellow { fill: #febc2e; }
      .terminal-dot-green { fill: #28c840; }
      .terminal-title { fill: #8b949e; font-family: 'Consolas', 'Courier New', monospace; font-size: 12px; }

      .code-text {
        font-family: 'Consolas', 'Courier New', monospace;
        font-size: 13.5px;
        fill: #00ff66;
        filter: drop-shadow(0 0 2px rgba(0,255,102,0.4));
      }
      .code-key { fill: #00ff66; font-weight: bold; }
      .code-colon { fill: #28c840; }
      .code-val { fill: #00ff66; }
      .code-bullet { fill: #45dccc; }
      .code-str { fill: #79c0ff; }

      .t1 { animation: fadeIn1 9s steps(1, end) infinite; opacity: 0; }
      .t2 { animation: fadeIn2 9s steps(1, end) infinite; opacity: 0; }
      .t3 { animation: fadeIn3 9s steps(1, end) infinite; opacity: 0; }
      .t4 { animation: fadeIn4 9s steps(1, end) infinite; opacity: 0; }
      .t5 { animation: fadeIn5 9s steps(1, end) infinite; opacity: 0; }
      .t6 { animation: fadeIn6 9s steps(1, end) infinite; opacity: 0; }
      .t7 { animation: fadeIn7 9s steps(1, end) infinite; opacity: 0; }
      .t8 { animation: fadeIn8 9s steps(1, end) infinite; opacity: 0; }
      .t9 { animation: fadeIn9 9s steps(1, end) infinite; opacity: 0; }

      .cursor {
        fill: #00ff66;
        animation: blink 0.7s infinite, cursorMove 9s steps(1, end) infinite;
        filter: drop-shadow(0 0 4px #00ff66);
      }

      .scanline {
        fill: url(#scanlineGrad);
        animation: scanDown 3.5s ease-in-out infinite;
      }
      @keyframes scanDown {
        0% { transform: translateY(-320px); }
        100% { transform: translateY(320px); }
      }
    </style>
    <linearGradient id="scanlineGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00ff66" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00ff66" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#00ff66" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="terminalClip">
      <rect x="0" y="0" width="650" height="320" rx="10" ry="10"/>
    </clipPath>
  </defs>

  <!-- Terminal Window -->
  <rect class="terminal-bg" x="0" y="0" width="650" height="320" rx="10" ry="10" stroke="#30363d" stroke-width="1.5"/>
  <rect class="terminal-header" x="1.5" y="1.5" width="647" height="32" rx="9" ry="9"/>
  <rect class="terminal-header" x="1.5" y="20" width="647" height="13"/>
  <line x1="1.5" y1="33" x2="648.5" y2="33" stroke="#30363d" stroke-width="1"/>

  <circle class="terminal-dot-red" cx="18" cy="17" r="5.5"/>
  <circle class="terminal-dot-yellow" cx="36" cy="17" r="5.5"/>
  <circle class="terminal-dot-green" cx="54" cy="17" r="5.5"/>

  <text class="terminal-title" x="325" y="21" text-anchor="middle">sabarishmettu / README.md</text>

  <!-- Terminal Body -->
  <g transform="translate(20, 56)" clip-path="url(#terminalClip)">
    <g class="t1">
      <text class="code-text" y="0"><tspan class="code-key">name</tspan><tspan class="code-colon">:</tspan><tspan class="code-val"> Sabarish Mettu</tspan></text>
    </g>
    <g class="t2">
      <text class="code-text" y="26"><tspan class="code-key">role</tspan><tspan class="code-colon">:</tspan><tspan class="code-val"> Developer &amp; Creator</tspan></text>
    </g>
    <g class="t3">
      <text class="code-text" y="52"><tspan class="code-key">location</tspan><tspan class="code-colon">:</tspan><tspan class="code-val"> India (UTC +05:30)</tspan></text>
    </g>
    <g class="t4">
      <text class="code-text" y="78"><tspan class="code-key">interests</tspan><tspan class="code-colon">:</tspan></text>
    </g>
    <g class="t5">
      <text class="code-text" y="104"><tspan class="code-bullet">  - </tspan><tspan class="code-val">Building innovative tools &amp; automations</tspan></text>
    </g>
    <g class="t6">
      <text class="code-text" y="130"><tspan class="code-bullet">  - </tspan><tspan class="code-val">Cybersecurity &amp; steganography</tspan></text>
    </g>
    <g class="t7">
      <text class="code-text" y="156"><tspan class="code-bullet">  - </tspan><tspan class="code-val">Game development</tspan></text>
    </g>
    <g class="t8">
      <text class="code-text" y="182"><tspan class="code-bullet">  - </tspan><tspan class="code-val">Web development</tspan></text>
    </g>
    <g class="t9">
      <text class="code-text" y="208"><tspan class="code-key">motto</tspan><tspan class="code-colon">:</tspan><tspan class="code-str"> "Turning imagination into working code"</tspan></text>
    </g>

    <!-- Cursor -->
    <rect class="cursor" x="0" y="-13" width="8" height="17" rx="1"/>
  </g>

  <rect class="scanline" x="0" y="0" width="650" height="320" clip-path="url(#terminalClip)"/>
</svg>
