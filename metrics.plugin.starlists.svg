<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 160" width="450" height="160">
  <defs>
    <style>
      .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1; }
      .header-title { fill: #45dccc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: bold; }
      .subtext { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; }
      .lang-text { fill: #c9d1d9; font-family: 'Consolas', monospace; font-size: 10px; }
    </style>
  </defs>

  <rect class="bg" width="450" height="160" rx="8"/>

  <text class="header-title" x="16" y="24">🌟 7 Star lists</text>
  <text class="subtext" x="16" y="42">📙 Awesome  |  28 repositories  |  Thanks for contributing to mankind progress!</text>

  <!-- Progress bar -->
  <g transform="translate(16, 55)">
    <rect x="0" y="0" width="120" height="8" fill="#3178c6" rx="2"/>
    <rect x="122" y="0" width="105" height="8" fill="#f1e05a" rx="2"/>
    <rect x="229" y="0" width="45" height="8" fill="#f34b7d" rx="2"/>
    <rect x="276" y="0" width="45" height="8" fill="#555555" rx="2"/>
    <rect x="323" y="0" width="15" height="8" fill="#dea584" rx="2"/>
    <rect x="340" y="0" width="15" height="8" fill="#701516" rx="2"/>
    <rect x="357" y="0" width="15" height="8" fill="#b07219" rx="2"/>
    <rect x="374" y="0" width="15" height="8" fill="#b0b7b0" rx="2"/>
  </g>

  <!-- Language details grid -->
  <g transform="translate(16, 82)">
    <!-- Column 1 -->
    <circle cx="5" cy="5" r="4" fill="#3178c6"/>
    <text class="lang-text" x="14" y="8">TypeScript  28.57%</text>

    <circle cx="5" cy="23" r="4" fill="#f34b7d"/>
    <text class="lang-text" x="14" y="26">C++         10.71%</text>

    <circle cx="5" cy="41" r="4" fill="#dea584"/>
    <text class="lang-text" x="14" y="44">Rust         3.57%</text>

    <circle cx="5" cy="59" r="4" fill="#b07219"/>
    <text class="lang-text" x="14" y="62">Ruby         3.57%</text>

    <!-- Column 2 -->
    <circle cx="215" cy="5" r="4" fill="#f1e05a"/>
    <text class="lang-text" x="224" y="8">JavaScript  25.00%</text>

    <circle cx="215" cy="23" r="4" fill="#555555"/>
    <text class="lang-text" x="224" y="26">C           10.71%</text>

    <circle cx="215" cy="41" r="4" fill="#701516"/>
    <text class="lang-text" x="224" y="44">CodeQL       3.57%</text>

    <circle cx="215" cy="59" r="4" fill="#b0b7b0"/>
    <text class="lang-text" x="224" y="62">Java         3.57%</text>
  </g>
</svg>
