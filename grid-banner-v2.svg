<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <!-- SVG Native Filter for Neon Glow (GitHub Camo and Cross-Browser Safe) -->
    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur1"/>
      <feGaussianBlur stdDeviation="8" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .bg { fill: #030d11; }

      /* --- 3D PERSPECTIVE GRID --- */
      .grid-lines {
        stroke: #22d3ee;
        stroke-width: 1.1;
        opacity: 0.28;
      }
      .grid-glow {
        stroke: #00f2fe;
        stroke-width: 1.8;
        opacity: 0.15;
      }

      /* --- HORIZON SCAN LINE --- */
      @keyframes scanDown {
        0%   { transform: translateY(0px); opacity: 0; }
        10%  { opacity: 0.8; }
        90%  { opacity: 0.8; }
        100% { transform: translateY(195px); opacity: 0; }
      }
      .scan-line {
        animation: scanDown 5s ease-in-out infinite;
      }

      /* --- LASER DATA PULSES (SHOOTING GRID STREAKS) --- */
      @keyframes pulseTravel1 {
        0%   { stroke-dashoffset: 1400; opacity: 0; }
        15%  { opacity: 1; }
        85%  { opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 0; }
      }
      @keyframes pulseTravel2 {
        0%   { stroke-dashoffset: 1400; opacity: 0; }
        15%  { opacity: 1; }
        85%  { opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 0; }
      }
      .data-pulse {
        stroke: #38efda;
        stroke-width: 2.8;
        stroke-dasharray: 100 1300;
        stroke-linecap: round;
      }
      .pulse--1 { animation: pulseTravel1 3.2s linear infinite; animation-delay: 0s; }
      .pulse--2 { animation: pulseTravel1 4.1s linear infinite; animation-delay: 1.2s; }
      .pulse--3 { animation: pulseTravel2 3.6s linear infinite; animation-delay: 2.1s; }
      .pulse--4 { animation: pulseTravel1 4.5s linear infinite; animation-delay: 0.6s; }
      .pulse--5 { animation: pulseTravel2 3.9s linear infinite; animation-delay: 2.8s; }
      .pulse--6 { animation: pulseTravel1 3.4s linear infinite; animation-delay: 1.8s; }

      /* --- FLOATING PARTICLES --- */
      @keyframes floatParticle {
        0%, 100% { transform: translate(0, 0); opacity: 0.2; }
        50% { transform: translate(12px, -18px); opacity: 0.9; }
      }
      .particle {
        fill: #38efda;
      }
      .p1 { animation: floatParticle 3.5s ease-in-out infinite; }
      .p2 { animation: floatParticle 4.8s ease-in-out infinite 0.6s; }
      .p3 { animation: floatParticle 4.1s ease-in-out infinite 1.2s; }
      .p4 { animation: floatParticle 5.2s ease-in-out infinite 1.8s; }
      .p5 { animation: floatParticle 3.8s ease-in-out infinite 0.3s; }
      .p6 { animation: floatParticle 4.4s ease-in-out infinite 2.2s; }
      .p7 { animation: floatParticle 5.0s ease-in-out infinite 1.5s; }

      /* --- WIREFRAME POLYGON RINGS (AT HORIZON) --- */
      @keyframes pulsePoly {
        0%, 100% { opacity: 0.25; stroke-width: 1.2; }
        50% { opacity: 0.75; stroke-width: 1.8; }
      }
      .wire-poly {
        fill: none;
        stroke: #38efda;
      }
      .poly-1 { animation: pulsePoly 4s ease-in-out infinite; }
      .poly-2 { animation: pulsePoly 5s ease-in-out infinite 1s; }
      .poly-3 { animation: pulsePoly 6s ease-in-out infinite 2s; }

      /* --- TYPING MONOSPACE BANNER TEXT --- */
      .type-text {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 32px;
        font-weight: 700;
        letter-spacing: 0.5px;
        fill: #38efda;
      }

      /* --- BLINKING TERMINAL CURSOR BLOCK --- */
      @keyframes blinkCursor {
        0%, 48%   { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .cursor-block {
        fill: #38efda;
        animation: blinkCursor 0.9s infinite;
      }

      /* --- HUD CORNERS AND LABELS --- */
      .hud-line {
        stroke: #22d3ee;
        stroke-width: 2;
        fill: none;
        opacity: 0.65;
      }
      .hud-subline {
        stroke: #22d3ee;
        stroke-width: 1;
        fill: none;
        opacity: 0.35;
      }
      @keyframes blinkDot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.2; }
      }
      .status-dot {
        fill: #38efda;
        animation: blinkDot 2.2s ease-in-out infinite;
      }
      .dot-2 { animation-delay: 0.4s; }
      .dot-3 { animation-delay: 0.8s; }

      .hud-text {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 11.5px;
        font-weight: 700;
        letter-spacing: 1.2px;
        fill: #38efda;
        opacity: 0.8;
      }
    </style>

    <!-- Background Radial Atmosphere Glow -->
    <radialGradient id="cyberGlowGrad" cx="50%" cy="28%" r="65%">
      <stop offset="0%" stop-color="#0e4450" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="#06222a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#030d11" stop-opacity="0"/>
    </radialGradient>

    <!-- Scan Line Gradient -->
    <linearGradient id="scanlineGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38efda" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="gridHorizonClip">
      <rect x="0" y="105" width="1200" height="195" />
    </clipPath>

    <!-- 3D Perspective Rays radiating from Horizon Center (600, 105) -->
    <g id="perspectiveRays">
      <line x1="600" y1="105" x2="-650" y2="300" />
      <line x1="600" y1="105" x2="-420" y2="300" />
      <line x1="600" y1="105" x2="-210" y2="300" />
      <line x1="600" y1="105" x2="-20"  y2="300" />
      <line x1="600" y1="105" x2="140"  y2="300" />
      <line x1="600" y1="105" x2="280"  y2="300" />
      <line x1="600" y1="105" x2="400"  y2="300" />
      <line x1="600" y1="105" x2="510"  y2="300" />
      <line x1="600" y1="105" x2="600"  y2="300" />
      <line x1="600" y1="105" x2="690"  y2="300" />
      <line x1="600" y1="105" x2="800"  y2="300" />
      <line x1="600" y1="105" x2="920"  y2="300" />
      <line x1="600" y1="105" x2="1060" y2="300" />
      <line x1="600" y1="105" x2="1220" y2="300" />
      <line x1="600" y1="105" x2="1410" y2="300" />
      <line x1="600" y1="105" x2="1620" y2="300" />
      <line x1="600" y1="105" x2="1850" y2="300" />
    </g>

    <!-- Horizontal Depth Grid Lines (Exponential Perspective) -->
    <g id="perspectiveDepths">
      <line x1="0" y1="109" x2="1200" y2="109" />
      <line x1="0" y1="113" x2="1200" y2="113" />
      <line x1="0" y1="118" x2="1200" y2="118" />
      <line x1="0" y1="124" x2="1200" y2="124" />
      <line x1="0" y1="132" x2="1200" y2="132" />
      <line x1="0" y1="142" x2="1200" y2="142" />
      <line x1="0" y1="155" x2="1200" y2="155" />
      <line x1="0" y1="171" x2="1200" y2="171" />
      <line x1="0" y1="192" x2="1200" y2="192" />
      <line x1="0" y1="219" x2="1200" y2="219" />
      <line x1="0" y1="253" x2="1200" y2="253" />
      <line x1="0" y1="295" x2="1200" y2="295" />
    </g>
  </defs>

  <!-- Deep Cyber Dark Base Background -->
  <rect class="bg" width="1200" height="300" />
  <rect width="1200" height="300" fill="url(#cyberGlowGrad)" />

  <!-- Multi-layered Rotating Wireframe Polygon at Horizon (SMIL SVG Native Rotations) -->
  <g filter="url(#softGlow)">
    <!-- Polygon Layer 1 (Outer Hexagon) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 600 92" to="360 600 92" dur="22s" repeatCount="indefinite"/>
      <polygon class="wire-poly poly-1" points="600,48 642,68 642,116 600,136 558,116 558,68" />
    </g>
    <!-- Polygon Layer 2 (Middle Hexagon) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 600 92" to="-360 600 92" dur="28s" repeatCount="indefinite"/>
      <polygon class="wire-poly poly-2" points="600,38 652,62 652,122 600,146 548,122 548,62" />
    </g>
    <!-- Polygon Layer 3 (Inner Nested Ring) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 600 92" to="360 600 92" dur="34s" repeatCount="indefinite"/>
      <polygon class="wire-poly poly-3" points="600,58 630,74 630,110 600,126 570,110 570,74" />
    </g>
  </g>

  <!-- 3D Perspective Grid Field -->
  <g class="grid-lines" clip-path="url(#gridHorizonClip)">
    <use href="#perspectiveRays" />
    <use href="#perspectiveDepths" />
  </g>

  <!-- Grid Ambient Glow Overlay -->
  <g class="grid-glow" clip-path="url(#gridHorizonClip)">
    <use href="#perspectiveDepths" />
  </g>

  <!-- Animated Horizon Scan Wave -->
  <rect class="scan-line" x="0" y="105" width="1200" height="12" fill="url(#scanlineGrad)" clip-path="url(#gridHorizonClip)"/>

  <!-- High-Speed Laser Data Pulses on Grid Rays -->
  <g fill="none" clip-path="url(#gridHorizonClip)" filter="url(#cyanGlow)">
    <line class="data-pulse pulse--1" x1="600" y1="105" x2="-210" y2="300"/>
    <line class="data-pulse pulse--2" x1="600" y1="105" x2="280"  y2="300"/>
    <line class="data-pulse pulse--3" x1="600" y1="105" x2="920"  y2="300"/>
    <line class="data-pulse pulse--4" x1="600" y1="105" x2="1220" y2="300"/>
    <line class="data-pulse pulse--5" x1="600" y1="105" x2="510"  y2="300"/>
    <line class="data-pulse pulse--6" x1="600" y1="105" x2="800"  y2="300"/>
  </g>

  <!-- Floating Ambient Particles in Atmospheric Sky -->
  <g filter="url(#softGlow)">
    <circle class="particle p1" cx="140" cy="55"  r="1.6"/>
    <circle class="particle p2" cx="275" cy="38"  r="1.2"/>
    <circle class="particle p3" cx="448" cy="72"  r="2.0"/>
    <circle class="particle p4" cx="752" cy="48"  r="1.4"/>
    <circle class="particle p5" cx="880" cy="68"  r="1.8"/>
    <circle class="particle p6" cx="1035" cy="42" r="1.3"/>
    <circle class="particle p7" cx="195" cy="85"  r="1.5"/>
  </g>

  <!-- Horizon Line with Neon Edge Glow -->
  <line x1="0" y1="105" x2="1200" y2="105" stroke="#38efda" stroke-width="1.5" opacity="0.75" filter="url(#softGlow)"/>

  <!-- =================================================================== -->
  <!-- MAIN TYPED SLOGAN BANNER - 3 Phrases, 18s total cycle -->
  <!-- Phrase 1 (0s-6s): Creating Imaginary to Reality -->
  <!-- Phrase 2 (6s-12s): Hi, I am Sabarish -->
  <!-- Phrase 3 (12s-18s): Developer and Creator -->
  <!-- =================================================================== -->
  <g filter="url(#softGlow)">

    <!-- ============ PHRASE 1: "Creating Imaginary to Reality" ============ -->
    <!-- 29 characters. Types 0-3.5s, holds 3.5-5.5s, fades 5.5-6s -->
    <text x="600" y="154" text-anchor="middle" fill="#38efda" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="28" font-weight="700" letter-spacing="1px">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.005;0.305;0.333;1" dur="18s" repeatCount="indefinite"/>
      <set attributeName="visibility" to="visible" begin="0s" dur="6s" repeatCount="indefinite"/>
      Creating Imaginary to Reality
    </text>

    <!-- Blinking cursor for Phrase 1 -->
    <rect fill="#38efda" y="130" width="14" height="30" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.005;0.305;0.333;1" dur="18s" repeatCount="indefinite"/>
      <animate attributeName="x" values="340;340;380;398;416;434;452;470;488;506;524;542;560;578;596;614;632;650;668;686;704;722;740;758;776;794;812;830;848;848;848" keyTimes="0;0.006;0.012;0.018;0.024;0.030;0.036;0.042;0.048;0.054;0.060;0.066;0.072;0.078;0.084;0.090;0.096;0.102;0.108;0.114;0.120;0.126;0.132;0.138;0.144;0.150;0.156;0.162;0.168;0.194;1" dur="18s" repeatCount="indefinite" calcMode="discrete"/>
    </rect>

    <!-- ============ PHRASE 2: "Hi, I am Sabarish" ============ -->
    <!-- 18 characters. Types 6-8.5s, holds 8.5-11.5s, fades 11.5-12s -->
    <text x="600" y="154" text-anchor="middle" fill="#38efda" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="28" font-weight="700" letter-spacing="1px">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.333;0.339;0.639;0.666;1" dur="18s" repeatCount="indefinite"/>
      Hi, I am Sabarish
    </text>

    <!-- Blinking cursor for Phrase 2 -->
    <rect fill="#38efda" y="130" width="14" height="30" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.333;0.339;0.639;0.666;1" dur="18s" repeatCount="indefinite"/>
      <animate attributeName="x" values="441;441;459;477;495;513;531;549;567;585;603;621;639;657;675;693;711;729;729;729" keyTimes="0;0.339;0.345;0.351;0.357;0.363;0.369;0.375;0.381;0.387;0.393;0.399;0.405;0.411;0.417;0.423;0.429;0.435;0.472;1" dur="18s" repeatCount="indefinite" calcMode="discrete"/>
    </rect>

    <!-- ============ PHRASE 3: "Developer and Creator" ============ -->
    <!-- 21 characters. Types 12-14.5s, holds 14.5-17.5s, fades 17.5-18s -->
    <text x="600" y="154" text-anchor="middle" fill="#38efda" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="28" font-weight="700" letter-spacing="1px">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.666;0.672;0.972;1" dur="18s" repeatCount="indefinite"/>
      Developer and Creator
    </text>

    <!-- Blinking cursor for Phrase 3 -->
    <rect fill="#38efda" y="130" width="14" height="30" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.666;0.672;0.972;1" dur="18s" repeatCount="indefinite"/>
      <animate attributeName="x" values="400;400;418;436;454;472;490;508;526;544;562;580;598;616;634;652;670;688;706;724;742;760;760;760" keyTimes="0;0.672;0.678;0.684;0.690;0.696;0.702;0.708;0.714;0.720;0.726;0.732;0.738;0.744;0.750;0.756;0.762;0.768;0.774;0.780;0.786;0.792;0.806;1" dur="18s" repeatCount="indefinite" calcMode="discrete"/>
    </rect>
  </g>

  <!-- =================================================================== -->
  <!-- HUD INTERFACE ELEMENTS (Top-Left, Top-Right, Corner Brackets) -->
  <!-- =================================================================== -->

  <!-- Top-Left: ● ● ● SYSTEM ONLINE -->
  <g transform="translate(60, 32)">
    <circle class="status-dot" cx="0" cy="0" r="3.5" />
    <circle class="status-dot dot-2" cx="13" cy="0" r="3.5" />
    <circle class="status-dot dot-3" cx="26" cy="0" r="3.5" />
    <text class="hud-text" x="40" y="4.5">SYSTEM ONLINE</text>
  </g>

  <!-- Top-Right: v2.0.26 -->
  <text class="hud-text" x="1140" y="36.5" text-anchor="end">v2.0.26</text>

  <!-- HUD Corner Brackets [ ] -->
  <!-- Top Left -->
  <g class="hud-line">
    <polyline points="20,50 20,20 50,20"/>
  </g>
  <g class="hud-subline">
    <polyline points="26,35 26,26 35,26"/>
  </g>

  <!-- Top Right -->
  <g class="hud-line">
    <polyline points="1150,20 1180,20 1180,50"/>
  </g>
  <g class="hud-subline">
    <polyline points="1165,26 1174,26 1174,35"/>
  </g>

  <!-- Bottom Right -->
  <g class="hud-line">
    <polyline points="1180,250 1180,280 1150,280"/>
  </g>
  <g class="hud-subline">
    <polyline points="1174,265 1174,274 1165,274"/>
  </g>

  <!-- Bottom Left -->
  <g class="hud-line">
    <polyline points="50,280 20,280 20,250"/>
  </g>
  <g class="hud-subline">
    <polyline points="35,274 26,274 26,265"/>
  </g>

  <!-- Fine Border Ring -->
  <rect x="18" y="18" width="1164" height="264" rx="4" fill="none" stroke="#22d3ee" stroke-width="0.75" opacity="0.25"/>
</svg>
