<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <style>
      .banner-bg { fill: #030c11; }
      .grid-line { stroke: #00f2fe; stroke-width: 1; opacity: 0.28; }
      .grid-glow { stroke: #38efda; stroke-width: 1.5; opacity: 0.4; }
      .horizon-line { stroke: #00f2fe; stroke-width: 1.8; opacity: 0.8; }
      
      .hud-text {
        fill: #67e8f9;
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 12px;
        letter-spacing: 1.5px;
        opacity: 0.85;
      }
      .hud-line { stroke: #00f2fe; stroke-width: 1.5; fill: none; opacity: 0.6; }
      
      .dot-green { fill: #10b981; }
      .dot-yellow { fill: #f59e0b; }
      .dot-cyan { fill: #00f2fe; }

      .type-text {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 32px;
        font-weight: 700;
        letter-spacing: 1px;
        fill: #00f2fe;
      }

      .cursor {
        fill: #00f2fe;
      }

      @keyframes pulseHex {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.05); }
      }
      .hex-ring {
        fill: none;
        stroke: #38efda;
        stroke-width: 1.5;
        opacity: 0.5;
      }
    </style>

    <!-- Deep Space Horizon Glow -->
    <radialGradient id="spaceGlow" cx="50%" cy="36%" r="60%">
      <stop offset="0%" stop-color="#0e4450" stop-opacity="0.6"/>
      <stop offset="45%" stop-color="#06222a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#030c11" stop-opacity="0"/>
    </radialGradient>

    <!-- Scanline Sweep Gradient -->
    <linearGradient id="scanWave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="horizonClip">
      <rect x="1" y="110" width="1198" height="188" rx="0" />
    </clipPath>
  </defs>

  <!-- Cyber Container with Neon Cyan Border -->
  <rect class="banner-bg" width="1200" height="300" rx="12" ry="12" stroke="#155e75" stroke-width="1.5"/>
  <rect width="1200" height="300" rx="12" ry="12" fill="url(#spaceGlow)"/>

  <!-- HUD Top Header Elements -->
  <g transform="translate(45, 36)">
    <!-- Status Dots -->
    <circle class="dot-green" cx="0" cy="0" r="4.5">
      <animate attributeName="opacity" values="1; 0.3; 1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle class="dot-yellow" cx="15" cy="0" r="4.5"/>
    <circle class="dot-cyan" cx="30" cy="0" r="4.5"/>
    <text class="hud-text" x="48" y="4.5">sabarishmettu // SYSTEM ONLINE</text>
  </g>
  <text class="hud-text" x="1155" y="40.5" text-anchor="end">v2.0.26</text>

  <!-- HUD Corner Brackets -->
  <!-- Top Left -->
  <polyline class="hud-line" points="20,50 20,20 50,20"/>
  <!-- Top Right -->
  <polyline class="hud-line" points="1150,20 1180,20 1180,50"/>
  <!-- Bottom Left -->
  <polyline class="hud-line" points="50,280 20,280 20,250"/>
  <!-- Bottom Right -->
  <polyline class="hud-line" points="1180,250 1180,280 1150,280"/>

  <!-- Center Horizon Wireframe Hexagons -->
  <g transform="translate(600, 110)">
    <polygon class="hex-ring" points="0,-45 39,-22 39,22 0,45 -39,22 -39,-22">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
    </polygon>
    <polygon class="hex-ring" points="0,-32 28,-16 28,16 0,32 -28,16 -28,-16" stroke="#00f2fe" stroke-width="1.2">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="18s" repeatCount="indefinite"/>
    </polygon>
    <circle cx="0" cy="0" r="8" fill="#00f2fe" opacity="0.6">
      <animate attributeName="r" values="6; 10; 6" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4; 0.9; 0.4" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 3D Perspective Grid Rays -->
  <g class="grid-line" clip-path="url(#horizonClip)">
    <line x1="600" y1="110" x2="-400" y2="300"/>
    <line x1="600" y1="110" x2="-180" y2="300"/>
    <line x1="600" y1="110" x2="0"    y2="300"/>
    <line x1="600" y1="110" x2="160"  y2="300"/>
    <line x1="600" y1="110" x2="300"  y2="300"/>
    <line x1="600" y1="110" x2="420"  y2="300"/>
    <line x1="600" y1="110" x2="520"  y2="300"/>
    <line x1="600" y1="110" x2="600"  y2="300" stroke="#00f2fe" stroke-width="1.4" opacity="0.6"/>
    <line x1="600" y1="110" x2="680"  y2="300"/>
    <line x1="600" y1="110" x2="780"  y2="300"/>
    <line x1="600" y1="110" x2="900"  y2="300"/>
    <line x1="600" y1="110" x2="1040" y2="300"/>
    <line x1="600" y1="110" x2="1200" y2="300"/>
    <line x1="600" y1="110" x2="1380" y2="300"/>
    <line x1="600" y1="110" x2="1600" y2="300"/>

    <!-- Depth Perspective Lines -->
    <line x1="0" y1="114" x2="1200" y2="114"/>
    <line x1="0" y1="119" x2="1200" y2="119"/>
    <line x1="0" y1="126" x2="1200" y2="126"/>
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="147" x2="1200" y2="147"/>
    <line x1="0" y1="162" x2="1200" y2="162"/>
    <line x1="0" y1="181" x2="1200" y2="181"/>
    <line x1="0" y1="205" x2="1200" y2="205"/>
    <line x1="0" y1="235" x2="1200" y2="235"/>
    <line x1="0" y1="272" x2="1200" y2="272"/>
  </g>

  <!-- Glowing Horizon Line -->
  <line class="horizon-line" x1="2" y1="110" x2="1198" y2="110"/>

  <!-- Scanning Laser Sweep -->
  <rect x="0" y="110" width="1200" height="15" fill="url(#scanWave)" clip-path="url(#horizonClip)">
    <animate attributeName="y" values="110; 285; 110" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- Laser Data Pulse on Center Grid -->
  <line x1="600" y1="110" x2="600" y2="300" stroke="#38efda" stroke-width="3" stroke-linecap="round" stroke-dasharray="40 200" clip-path="url(#horizonClip)">
    <animate attributeName="stroke-dashoffset" values="240; 0" dur="2s" repeatCount="indefinite"/>
  </line>

  <!-- Animated Typed Banner Text: "Creating Imaginary to Reality █" -->
  <g transform="translate(600, 160)">
    <!-- Phrase 1: "Creating Imaginary to Reality" -->
    <g class="type-text" text-anchor="middle">
      <text x="0" y="0">
        <tspan opacity="0"><animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.02; 0.04; 0.65; 0.67; 1" dur="11s" repeatCount="indefinite"/>C</tspan>
        <tspan opacity="0"><animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.04; 0.06; 0.65; 0.67; 1" dur="11s" repeatCount="indefinite"/>r</tspan>
        <tspan opacity="0"><animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.06; 0.08; 0.65; 0.67; 1" dur="11s" repeatCount="indefinite"/>e</tspan>
        <tspan opacity="0"><animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.08; 0.10; 0.65; 0.67; 1" dur="11s" repeatCount="indefinite"/>a</tspan>
        <tspan opacity="0"><animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.10; 0.12; 0.65; 0.67; 1" dur="11s" repeatCount="indefinite"/>t</tspan>
        <tspan opacity="0"><animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.12; 0.14; 0.65; 0.67; 1" dur="11s" repeatCount="indefinite"/>i</tspan>
        <tspan opacity="0"><animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.14; 0.16; 0.65; 0.67; 1" dur="11s" repeatCount="indefinite"/>n</tspan>
        <tspan opacity="0"><animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.16; 0.18; 0.65; 0.67; 1" dur="11s" repeatCount="indefinite"/>g</tspan>
        <tspan opacity="0"><animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.18; 0.20; 0.65; 0.67; 1" dur="11s" repeatCount="indefinite">&#160;</tspan>
        <tspan opacity="0"><animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.20; 0.22; 0.65; 0.67; 1" dur="11s" repeatCount="indefinite"/>I</tspan>
        <tspan opacity="0"><animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.22; 0.24; 0.65; 0.67; 1" dur="11s" repeatCount="indefinite"/>m</tspan>
        <tspan opacity="0"><animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.24; 0.26; 0.65; 0.67; 1" dur="11s" repeatCount="indefinite"/>a</tspan>
        <tspan opacity="0"><animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.26; 0.28; 0.65; 0.67; 1" dur="11s" repeatCount="indefinite"/>g</tspan>
        <tspan opacity="0"><animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.28; 0.30; 0.65; 0.67; 1" dur="11s" repeatCount="indefinite"/>i</tspan>
        <tspan opacity="0"><animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.30; 0.32; 0.65; 0.67; 1" dur="11s" repeatCount="indefinite"/>n</tspan>
        <tspan opacity="0"><animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.32; 0.34; 0.65; 0.67; 1" dur="11s" repeatCount="indefinite"/>a</tspan>
        <tspan opacity="0"><animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.34; 0.36; 0.65; 0.67; 1" dur="11s" repeatCount="indefinite"/>r</tspan>
        <tspan opacity="0"><animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.36; 0.38; 0.65; 0.67; 1" dur="11s" repeatCount="indefinite"/>y</tspan>
        <tspan opacity="0"><animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.38; 0.40; 0.65; 0.67; 1" dur="11s" repeatCount="indefinite">&#160;</tspan>
        <tspan opacity="0"><animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.40; 0.42; 0.65; 0.67; 1" dur="11s" repeatCount="indefinite"/>t</tspan>
        <tspan opacity="0"><animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.42; 0.44; 0.65; 0.67; 1" dur="11s" repeatCount="indefinite"/>o</tspan>
        <tspan opacity="0"><animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.44; 0.46; 0.65; 0.67; 1" dur="11s" repeatCount="indefinite">&#160;</tspan>
        <tspan opacity="0"><animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.46; 0.48; 0.65; 0.67; 1" dur="11s" repeatCount="indefinite"/>R</tspan>
        <tspan opacity="0"><animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.48; 0.50; 0.65; 0.67; 1" dur="11s" repeatCount="indefinite"/>e</tspan>
        <tspan opacity="0"><animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.50; 0.52; 0.65; 0.67; 1" dur="11s" repeatCount="indefinite"/>a</tspan>
        <tspan opacity="0"><animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.52; 0.54; 0.65; 0.67; 1" dur="11s" repeatCount="indefinite"/>l</tspan>
        <tspan opacity="0"><animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.54; 0.56; 0.65; 0.67; 1" dur="11s" repeatCount="indefinite"/>i</tspan>
        <tspan opacity="0"><animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.56; 0.58; 0.65; 0.67; 1" dur="11s" repeatCount="indefinite"/>t</tspan>
        <tspan opacity="0"><animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.58; 0.60; 0.65; 0.67; 1" dur="11s" repeatCount="indefinite"/>y</tspan>
      </text>

      <!-- Phrase 2: "Hi, I'm Sabarish | SABER.DEV" -->
      <text x="0" y="0">
        <tspan opacity="0"><animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.69; 0.71; 0.96; 0.98; 1" dur="11s" repeatCount="indefinite"/>H</tspan>
        <tspan opacity="0"><animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.71; 0.73; 0.96; 0.98; 1" dur="11s" repeatCount="indefinite"/>i</tspan>
        <tspan opacity="0"><animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.73; 0.74; 0.96; 0.98; 1" dur="11s" repeatCount="indefinite"/>,</tspan>
        <tspan opacity="0"><animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.74; 0.75; 0.96; 0.98; 1" dur="11s" repeatCount="indefinite">&#160;</tspan>
        <tspan opacity="0"><animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.75; 0.77; 0.96; 0.98; 1" dur="11s" repeatCount="indefinite"/>I</tspan>
        <tspan opacity="0"><animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.77; 0.78; 0.96; 0.98; 1" dur="11s" repeatCount="indefinite">&apos;</tspan>
        <tspan opacity="0"><animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.78; 0.80; 0.96; 0.98; 1" dur="11s" repeatCount="indefinite"/>m</tspan>
        <tspan opacity="0"><animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.80; 0.81; 0.96; 0.98; 1" dur="11s" repeatCount="indefinite">&#160;</tspan>
        <tspan opacity="0"><animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.81; 0.83; 0.96; 0.98; 1" dur="11s" repeatCount="indefinite"/>S</tspan>
        <tspan opacity="0"><animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.83; 0.84; 0.96; 0.98; 1" dur="11s" repeatCount="indefinite"/>a</tspan>
        <tspan opacity="0"><animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.84; 0.86; 0.96; 0.98; 1" dur="11s" repeatCount="indefinite"/>b</tspan>
        <tspan opacity="0"><animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.86; 0.87; 0.96; 0.98; 1" dur="11s" repeatCount="indefinite"/>a</tspan>
        <tspan opacity="0"><animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.87; 0.89; 0.96; 0.98; 1" dur="11s" repeatCount="indefinite"/>r</tspan>
        <tspan opacity="0"><animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.89; 0.90; 0.96; 0.98; 1" dur="11s" repeatCount="indefinite"/>i</tspan>
        <tspan opacity="0"><animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.90; 0.92; 0.96; 0.98; 1" dur="11s" repeatCount="indefinite"/>s</tspan>
        <tspan opacity="0"><animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.92; 0.93; 0.96; 0.98; 1" dur="11s" repeatCount="indefinite"/>h</tspan>
        <tspan opacity="0"><animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.93; 0.94; 0.96; 0.98; 1" dur="11s" repeatCount="indefinite">&#160;</tspan>
        <tspan opacity="0"><animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.94; 0.95; 0.96; 0.98; 1" dur="11s" repeatCount="indefinite">|</tspan>
        <tspan opacity="0"><animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.95; 0.96; 0.96; 0.98; 1" dur="11s" repeatCount="indefinite">&#160;</tspan>
        <tspan opacity="0"><animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.96; 0.97; 0.96; 0.98; 1" dur="11s" repeatCount="indefinite"/>D</tspan>
        <tspan opacity="0"><animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.97; 0.98; 0.96; 0.98; 1" dur="11s" repeatCount="indefinite"/>E</tspan>
        <tspan opacity="0"><animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.98; 0.99; 0.96; 0.98; 1" dur="11s" repeatCount="indefinite"/>V</tspan>
