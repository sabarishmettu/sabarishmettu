<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 200" width="750" height="200">
  <defs>
    <style>
      .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1; }
      .header-title { fill: #45dccc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: bold; }
      .subhead { fill: #58a6ff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: bold; }
      .text-item { fill: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; }
      .text-dim { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 9.5px; }
      .box { fill: #161b22; stroke: #30363d; stroke-width: 1; rx: 6; }
    </style>
  </defs>

  <rect class="bg" width="750" height="200" rx="8"/>

  <!-- Left Box: Permissions, limitations and conditions -->
  <g transform="translate(16, 16)">
    <rect class="box" width="350" height="168"/>
    <text class="header-title" x="14" y="24">▼ Permissions, limitations and conditions</text>
    
    <text class="subhead" x="14" y="48">📜 Licenses</text>
    <text class="text-dim" x="14" y="62">MIT  •  359 known licenses used</text>
    <text class="text-dim" x="14" y="74">479 dependencies  •  120 unknown licenses used</text>

    <!-- Permissions -->
    <text class="subhead" x="14" y="96">Permissions</text>
    <text class="text-item" x="14" y="112">✔ Commercial use</text>
    <text class="text-item" x="14" y="126">✔ Modification</text>
    <text class="text-item" x="14" y="140">✔ Distribution</text>
    <text class="text-item" x="14" y="154">✔ Private use</text>

    <!-- Limitations -->
    <text class="subhead" x="140" y="96">Limitations</text>
    <text class="text-item" x="140" y="112">✖ Liability</text>
    <text class="text-item" x="140" y="126">✖ Warranty</text>
    <text class="text-item" x="140" y="140">✖ Trademark use</text>
    <text class="text-item" x="140" y="154">✖ Patent use</text>

    <!-- Conditions -->
    <text class="subhead" x="245" y="96">Conditions</text>
    <text class="text-item" x="245" y="112">ℹ License and copyright notice</text>
    <text class="text-item" x="245" y="126">ℹ State changes</text>
  </g>

  <!-- Right Box: Licenses overview -->
  <g transform="translate(382, 16)">
    <rect class="box" width="350" height="168"/>
    <text class="header-title" x="14" y="24">▼ Licenses overview</text>

    <g transform="translate(14, 45)">
      <circle cx="6" cy="6" r="4" fill="#28c840"/>
      <text class="text-item" x="16" y="9">MIT</text>
      <text class="text-dim" x="280" y="9">321</text>

      <circle cx="6" cy="26" r="4" fill="#58a6ff"/>
      <text class="text-item" x="16" y="29">BSD-2-Clause</text>
      <text class="text-dim" x="280" y="29">15</text>

      <circle cx="6" cy="46" r="4" fill="#febc2e"/>
      <text class="text-item" x="16" y="49">CC0-1.0</text>
      <text class="text-dim" x="280" y="49">1</text>

      <circle cx="6" cy="66" r="4" fill="#a371f7"/>
      <text class="text-item" x="16" y="69">ISC</text>
      <text class="text-dim" x="280" y="69">76</text>

      <circle cx="6" cy="86" r="4" fill="#ff5f57"/>
      <text class="text-item" x="16" y="89">Apache-2.0</text>
      <text class="text-dim" x="280" y="89">15</text>

      <circle cx="6" cy="106" r="4" fill="#39d353"/>
      <text class="text-item" x="16" y="109">BSD-3-Clause</text>
      <text class="text-dim" x="280" y="109">6</text>
    </g>
  </g>
</svg>
