<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 260" width="450" height="260">
  <defs>
    <style>
      .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1; }
      .header-title { fill: #45dccc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: bold; }
      .subtext { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; }
      .card-title { fill: #58a6ff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: bold; }
      .card-desc { fill: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 9.5px; }
      .avatar-box { fill: #161b22; stroke: #30363d; stroke-width: 1; rx: 4; }
    </style>
  </defs>

  <rect class="bg" width="450" height="260" rx="8"/>

  <!-- Header -->
  <text class="header-title" x="16" y="24">🍿 AniList</text>
  <text class="subtext" x="16" y="40">Favorites genres: Action, Drama, Psychological, Sci-Fi, Adventure, Comedy</text>
  <text class="subtext" x="16" y="54">⏱️ 19.4k minutes watched  |  📚 5.91k chapters read</text>

  <!-- Anime 1 -->
  <rect class="avatar-box" x="16" y="68" width="418" height="50"/>
  <text class="card-title" x="26" y="86">serial experiments lain</text>
  <text class="subtext" x="26" y="99">CR Anime  |  1998  |  13 episodes</text>
  <text class="card-desc" x="26" y="111">We're all connected... There is the world around us, a world of people...</text>

  <!-- Anime 2 -->
  <rect class="avatar-box" x="16" y="126" width="418" height="50"/>
  <text class="card-title" x="26" y="144">Shin Seiki Evangelion</text>
  <text class="subtext" x="26" y="157">CR Anime  |  1995  |  26 episodes</text>
  <text class="card-desc" x="26" y="169">In the year 2015, the Angels, huge, tremendously powerful alien war machines...</text>

  <!-- Favorites characters -->
  <text class="header-title" x="16" y="196" font-size="11px">💖 Favorites characters</text>
